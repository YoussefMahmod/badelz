<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #0a0f1a;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    position: relative;
    overflow: hidden;
  }
  /* Subtle gradient */
  body::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at 20% 30%, rgba(200,255,0,0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(200,255,0,0.03) 0%, transparent 50%);
  }
  .content { position: relative; z-index: 1; text-align: center; }
  .brand {
    font-size: 28px; font-weight: 800; color: #c8ff00;
    letter-spacing: 6px; margin-bottom: 20px;
    text-transform: uppercase;
  }
  .brand span { font-weight: 400; opacity: 0.7; margin-left: 12px; letter-spacing: 2px; }
  .line {
    width: 80px; height: 3px; background: #c8ff00;
    border-radius: 2px; margin: 0 auto 40px;
  }
  .title {
    font-size: 56px; font-weight: 800; color: white;
    line-height: 1.2; margin-bottom: 16px;
    max-width: 900px;
  }
  .subtitle {
    font-size: 26px; color: rgba(255,255,255,0.5);
    max-width: 700px; line-height: 1.4;
  }
  .footer {
    position: absolute; bottom: 36px;
    font-size: 18px; font-weight: 600; color: #c8ff00;
    letter-spacing: 2px;
  }
  /* Decorative dots */
  .dot {
    position: absolute; border-radius: 50%; background: #c8ff00;
  }
  .dot-1 { width: 6px; height: 6px; top: 80px; right: 120px; opacity: 0.3; }
  .dot-2 { width: 4px; height: 4px; top: 200px; right: 80px; opacity: 0.15; }
  .dot-3 { width: 8px; height: 8px; bottom: 120px; left: 100px; opacity: 0.2; }
  .dot-4 { width: 5px; height: 5px; top: 150px; left: 150px; opacity: 0.1; }
</style>
</head>
<body>
  <div class="dot dot-1"></div>
  <div class="dot dot-2"></div>
  <div class="dot dot-3"></div>
  <div class="dot dot-4"></div>

  <div class="content">
    <div class="brand">BADELZ <span>بادلز</span></div>
    <div class="line"></div>
    <div class="title">احجز كورت بادل في مصر</div>
    <div class="subtitle">No app. No account. No fees.</div>
  </div>
  <div class="footer">badelz.app</div>
</body>
</html>
