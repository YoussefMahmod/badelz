<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="512" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c8ff00"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="#0a0f1a"/>
  <!-- Primary smash arc -->
  <path d="M 80 440 Q 110 60, 370 110 Q 450 120, 430 50"
        stroke="url(#g)" stroke-width="28" fill="none" stroke-linecap="round"/>
  <!-- Echo arc -->
  <path d="M 110 430 Q 140 150, 340 180"
        stroke="url(#g)" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.3"/>
  <!-- Ball -->
  <circle cx="430" cy="50" r="46" fill="#c8ff00"/>
  <!-- Impact ring -->
  <circle cx="430" cy="50" r="66" fill="none" stroke="#c8ff00" stroke-width="4" opacity="0.25"/>
</svg>
