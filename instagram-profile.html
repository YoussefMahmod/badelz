<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badelz Instagram Profile Picture</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 60px;
    padding: 40px;
    font-family: 'Inter', sans-serif;
  }

  .label {
    color: #fff;
    font-size: 14px;
    opacity: 0.5;
    margin-bottom: 8px;
    text-align: center;
    font-family: monospace;
    direction: ltr;
  }

  /* ============================================
     OPTION 1: Profile Picture (clean icon only)
     ============================================ */
  .profile-pic {
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: #0a0f1a;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .profile-pic::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 70% 30%, rgba(200,255,0,0.08) 0%, transparent 60%);
  }

  .profile-pic svg {
    width: 260px;
    height: 260px;
    position: relative;
    z-index: 1;
  }

  /* ============================================
     OPTION 2: Profile Picture with text
     ============================================ */
  .profile-pic-text {
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: #0a0f1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    gap: 8px;
  }

  .profile-pic-text::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 70% 30%, rgba(200,255,0,0.06) 0%, transparent 60%);
  }

  .profile-pic-text svg {
    width: 180px;
    height: 180px;
    position: relative;
    z-index: 1;
  }

  .profile-pic-text .wordmark {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .profile-pic-text .en {
    font-family: 'Inter', sans-serif;
    font-weight: 900;
    font-size: 36px;
    letter-spacing: 0.15em;
    color: #ffffff;
    line-height: 1;
  }

  .profile-pic-text .ar {
    font-size: 20px;
    font-weight: 700;
    color: #c8ff00;
    line-height: 1;
    direction: rtl;
  }

  /* ============================================
     OPTION 3: Square profile (for fallback)
     ============================================ */
  .profile-square {
    width: 400px;
    height: 400px;
    border-radius: 40px;
    background: #0a0f1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    gap: 12px;
  }

  .profile-square::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 70% 25%, rgba(200,255,0,0.08) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(16,185,129,0.05) 0%, transparent 50%);
  }

  .profile-square svg {
    width: 200px;
    height: 200px;
    position: relative;
    z-index: 1;
  }

  .profile-square .wordmark {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .profile-square .en {
    font-family: 'Inter', sans-serif;
    font-weight: 900;
    font-size: 42px;
    letter-spacing: 0.15em;
    color: #ffffff;
    line-height: 1;
  }

  .profile-square .ar {
    font-size: 24px;
    font-weight: 700;
    color: #c8ff00;
    line-height: 1;
    direction: rtl;
  }

  .profile-square .tagline {
    position: relative;
    z-index: 1;
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    direction: ltr;
    margin-top: 4px;
  }
</style>
</head>
<body>

<!-- Logo SVG template (reused) -->
<svg id="logo-template" style="display:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="smashGrad" x1="0" y1="100" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c8ff00"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <path d="M 15 105 Q 25 15, 85 25 Q 105 27, 100 12" stroke="url(#smashGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 22 102 Q 32 35, 78 42" stroke="url(#smashGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.35"/>
  <circle cx="100" cy="12" r="11" fill="#c8ff00"/>
  <circle cx="100" cy="12" r="16" fill="none" stroke="#c8ff00" stroke-width="1" opacity="0.3"/>
</svg>

<!-- OPTION 1: Icon only (cleanest for small profile pic) -->
<div>
  <div class="label">Option 1: Icon Only (recommended for profile pic)</div>
  <div class="profile-pic">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
      <defs>
        <linearGradient id="g1" x1="0" y1="100" x2="100" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#c8ff00"/>
          <stop offset="50%" stop-color="#10b981"/>
          <stop offset="100%" stop-color="#14b8a6"/>
        </linearGradient>
      </defs>
      <path d="M 15 105 Q 25 15, 85 25 Q 105 27, 100 12" stroke="url(#g1)" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M 22 102 Q 32 35, 78 42" stroke="url(#g1)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.35"/>
      <circle cx="100" cy="12" r="11" fill="#c8ff00"/>
      <circle cx="100" cy="12" r="16" fill="none" stroke="#c8ff00" stroke-width="1" opacity="0.3"/>
    </svg>
  </div>
</div>

<!-- OPTION 2: Icon + wordmark (circle) -->
<div>
  <div class="label">Option 2: Icon + Wordmark (circle)</div>
  <div class="profile-pic-text">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
      <defs>
        <linearGradient id="g2" x1="0" y1="100" x2="100" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#c8ff00"/>
          <stop offset="50%" stop-color="#10b981"/>
          <stop offset="100%" stop-color="#14b8a6"/>
        </linearGradient>
      </defs>
      <path d="M 15 105 Q 25 15, 85 25 Q 105 27, 100 12" stroke="url(#g2)" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M 22 102 Q 32 35, 78 42" stroke="url(#g2)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.35"/>
      <circle cx="100" cy="12" r="11" fill="#c8ff00"/>
      <circle cx="100" cy="12" r="16" fill="none" stroke="#c8ff00" stroke-width="1" opacity="0.3"/>
    </svg>
    <div class="wordmark">
      <span class="en">BADELZ</span>
      <span class="ar">بادلز</span>
    </div>
  </div>
</div>

<!-- OPTION 3: Square with tagline -->
<div>
  <div class="label">Option 3: Square with tagline</div>
  <div class="profile-square">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
      <defs>
        <linearGradient id="g3" x1="0" y1="100" x2="100" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#c8ff00"/>
          <stop offset="50%" stop-color="#10b981"/>
          <stop offset="100%" stop-color="#14b8a6"/>
        </linearGradient>
      </defs>
      <path d="M 15 105 Q 25 15, 85 25 Q 105 27, 100 12" stroke="url(#g3)" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M 22 102 Q 32 35, 78 42" stroke="url(#g3)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.35"/>
      <circle cx="100" cy="12" r="11" fill="#c8ff00"/>
      <circle cx="100" cy="12" r="16" fill="none" stroke="#c8ff00" stroke-width="1" opacity="0.3"/>
    </svg>
    <div class="wordmark">
      <span class="en">BADELZ</span>
      <span class="ar">بادلز</span>
    </div>
    <div class="tagline">EGYPT'S PADEL PLATFORM</div>
  </div>
</div>

</body>
</html>
